more:
  title: A little more

  bio:
    - I grew up in NJ, went to school in Boston, and stayed since.
    - I started my career with my first two co-ops where I took on a DevOps and Software Developer role. I was fortunate enough to learn from some great people and make a difference on my co-ops, thus earning me the Khoury Co-Op Award.
    - Outside of work, I'm usually on a golf course, tinkering with an idea, or hanging with friends and family. Right now I am curious about how to balance life and work, and where AI (healthily) fits into all of it.

  # Shown in this order. icon can be: golf, book, screen, code, headphones
  # (the golf one opens the putting game)
  interests:
    - name: Golf
      icon: golf
      text: I love playing, watching, and talking golf! I follow the PGA Tour quite a bit. My current goal is to break 80.

    # - name: Reading
